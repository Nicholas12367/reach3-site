worker_processes 1;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml
        font/woff
        font/woff2;

    map $sent_http_content_type $cache_control {
        ~*image/                "public, max-age=31536000, immutable";
        ~*text/css              "public, max-age=31536000, immutable";
        ~*application/javascript "public, max-age=31536000, immutable";
        ~*font/                 "public, max-age=31536000, immutable";
        text/html               "public, max-age=0, must-revalidate";
        default                 "public, max-age=86400";
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers (the BP-score targets)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # CSP allows our actual third-party deps (Google Fonts, unpkg for MapLibre, GA, tile server, form API)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://forms-api.reachscreens.ca https://tiles.openfreemap.org https://*.openfreemap.org https://www.google-analytics.com https://region1.google-analytics.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://forms-api.reachscreens.ca; upgrade-insecure-requests" always;

        add_header Cache-Control $cache_control always;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
